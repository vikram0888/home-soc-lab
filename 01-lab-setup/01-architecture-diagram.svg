<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <!-- Section labels -->
  <text x="150" y="35" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">VICTIM PC</text>
  <text x="850" y="35" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="middle">HOST LAPTOP (SIEM)</text>

  <!-- Victim PC box -->
  <rect x="40" y="60" width="220" height="300" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>

  <!-- Sysmon box -->
  <rect x="65" y="90" width="170" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="115" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Sysmon</text>
  <text x="150" y="133" font-size="11" fill="#374151" text-anchor="middle">(SwiftOnSecurity config)</text>

  <!-- arrow sysmon -> forwarder -->
  <line x1="150" y1="150" x2="150" y2="180" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Universal Forwarder box -->
  <rect x="65" y="185" width="170" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="210" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Splunk Universal</text>
  <text x="150" y="226" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Forwarder</text>

  <!-- arrow forwarder -> attack -->
  <line x1="150" y1="245" x2="150" y2="275" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Atomic Red Team box -->
  <rect x="65" y="280" width="170" height="60" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="150" y="305" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">PowerShell /</text>
  <text x="150" y="323" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Atomic Red Team</text>

  <!-- Host Laptop box -->
  <rect x="740" y="60" width="220" height="300" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>

  <!-- GoPhish box -->
  <rect x="765" y="90" width="170" height="55" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="850" y="113" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">GoPhish</text>
  <text x="850" y="130" font-size="11" fill="#374151" text-anchor="middle">(phishing simulation)</text>

  <line x1="850" y1="145" x2="850" y2="175" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Splunk Enterprise box -->
  <rect x="765" y="180" width="170" height="60" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="850" y="204" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">Splunk Enterprise</text>
  <text x="850" y="221" font-size="11" fill="#374151" text-anchor="middle">(port 9997, index=main)</text>

  <line x1="850" y1="240" x2="850" y2="270" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Detection rule / Alert box -->
  <rect x="765" y="275" width="170" height="65" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="850" y="298" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">Detection Rule (SPL)</text>
  <text x="850" y="315" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">→ Scheduled Alert</text>
  <text x="850" y="331" font-size="10" fill="#374151" text-anchor="middle">every 5 min, High severity</text>

  <!-- Middle connecting arrows -->
  <!-- Phishing click: GoPhish -> Victim -->
  <line x1="765" y1="117" x2="260" y2="117" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="105" font-size="11.5" fill="#15803d" text-anchor="middle">1. sends phishing email</text>

  <!-- Click back to host -->
  <line x1="260" y1="210" x2="765" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="200" font-size="11.5" fill="#1d4ed8" text-anchor="middle">2. victim clicks link (HTTP, captured in Wireshark)</text>

  <!-- Logs forwarded -->
  <line x1="260" y1="310" x2="765" y2="310" stroke="#374151" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="510" y="298" font-size="11.5" fill="#374151" text-anchor="middle">3. Sysmon logs forwarded via TCP 9997</text>

  <!-- Bottom: response -->
  <rect x="400" y="375" width="200" height="35" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="397" font-size="12.5" font-weight="bold" fill="#5b21b6" text-anchor="middle">osTicket (incident response)</text>

  <line x1="850" y1="340" x2="850" y2="392" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="850" y1="392" x2="600" y2="392" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="405" font-size="10.5" fill="#5b21b6" text-anchor="middle">4. triggered alert → ticket opened</text>
</svg>
